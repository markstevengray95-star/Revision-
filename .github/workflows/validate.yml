name: Validate combined revision app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  course-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
