<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Single-loop circuit with labelled components</title><desc id="desc">The rectangular loop has A, a pair of unequal parallel lines, at the top. B, a circle containing a cross, is at the right. C, a circle containing the letter A, is at the bottom.</desc><rect width="640" height="360" rx="12" fill="#f5f9fb"/><g fill="none" stroke="#203e4b" stroke-width="4"><path d="M300 80H140v200h160m40 0h160V80H340"/><path d="M300 50v60m40-45v30"/><circle cx="500" cy="180" r="30" fill="#f5f9fb"/><path d="m480 160 40 40m-40 0 40-40"/><circle cx="320" cy="280" r="30" fill="#f5f9fb"/></g><g font-family="sans-serif" font-size="24" fill="#203e4b" text-anchor="middle"><text x="320" y="288">A</text><text x="320" y="36">A</text><text x="555" y="188">B</text><text x="320" y="335">C</text></g></svg>
