<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Distance-time graph</title><desc id="desc">The line passes through time in seconds and distance in metres: 0,0; 10,20; 20,20; 30,40. Both axes have uniform linear scales.</desc><rect width="640" height="400" rx="12" fill="#f5f9fb"/><g stroke="#c7d7de" stroke-width="1"><path d="M100 320H550M100 255H550M100 190H550M100 125H550M100 60H550M100 60V320M250 60V320M400 60V320M550 60V320"/></g><path d="M100 40v280h475" stroke="#203e4b" fill="none" stroke-width="3"/><path d="M100 320 250 190 400 190 550 60" fill="none" stroke="#096975" stroke-width="5"/><g fill="#203e4b" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="100" y="346">0</text><text x="250" y="346">10</text><text x="400" y="346">20</text><text x="550" y="346">30</text><text x="320" y="380">Time / s</text><text x="72" y="326">0</text><text x="72" y="261">10</text><text x="72" y="196">20</text><text x="72" y="131">30</text><text x="72" y="66">40</text><text transform="translate(30 195) rotate(-90)">Distance / m</text></g></svg>
